[project]
name = "servergen-ai"
version = "0.1.0"
description = "ServerGen AI — Secure Enterprise Automation. A secure prototype foundation for controlled on-premise enterprise AI automation."
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "ServerGen AI Team"},
]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    # Security
    "pyjwt[crypto]>=2.10.0",
    "argon2-cffi>=25.0.0",
    "python-multipart>=0.0.18",
    # AI / LLM
    "ollama>=0.4.0",
    "httpx>=0.28.0",
    # Document Processing & RAG
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    ".pgdata",
    ".pgdist",
    "alembic",
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # assert allowed in tests
    "S105",  # possible hardcoded password (false positives on variable names)
    "S106",  # possible hardcoded password (false positives on variable names)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "E501", "RUF059", "F841"]
"alembic/**/*.py" = ["E501"]
"src/rag/store.py" = ["E501"]
"src/api/**/*.py" = ["B008", "E501"]
"src/agents/**/*.py" = ["E501"]
"src/ai/**/*.py" = ["E501"]
"src/services/auth_service.py" = ["E501"]
"src/services/docgen_service.py" = ["E501"]
"src/tools/docgen.py" = ["E501"]
"scripts/**/*.py" = ["E501", "T201", "S310"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
