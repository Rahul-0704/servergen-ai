version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: servergen-postgres
    environment:
      POSTGRES_USER: servergen
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: servergen
    ports:
      - "5432:5432"
    volumes:
      - servergen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servergen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-test:
    image: postgres:16-alpine
    container_name: servergen-postgres-test
    environment:
      POSTGRES_USER: servergen
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: servergen_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servergen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  servergen_pgdata:
